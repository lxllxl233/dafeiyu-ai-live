[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafeiyu-ai-live"
version = "2.4.0"
description = "大肥鱼直播姬 · 可换游戏 / 性格 / 声音的 AI 直播工具"
license = {text = "MIT"}
authors = [{name = "lxllxl233"}]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai", "live-streaming", "obs", "tts", "slay-the-spire"]
dependencies = [
  "requests>=2.31",
  "websockets>=12.0",
  "beautifulsoup4>=4.12",
  "Pillow>=10.0",
]

[project.optional-dependencies]
agent = ["langgraph>=1.0"]
dev = ["pytest>=8.0", "langgraph>=1.0"]

[project.scripts]
dafeiyu = "dafeiyu.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dafeiyu.ui" = ["assets/pet/*.png", "assets/pet/*.md", "assets/pet/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
