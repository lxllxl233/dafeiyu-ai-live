<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大肥鱼 · B站云观影场景</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; }
  body {
    color: #f7f1e3;
    font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", sans-serif;
    text-shadow: 0 2px 5px rgba(0,0,0,.75);
  }
  #scene { position: fixed; inset: 0; pointer-events: none; }

  /* 左上角标识：不要挡住视频主体，只占一条窄条 */
  #brand {
    position: absolute; left: 3vw; top: 3.2vh;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px;
    border: 1px solid rgba(244,201,104,.42);
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(18,20,30,.88), rgba(10,11,18,.72));
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    font-size: clamp(11px, .9vw, 15px);
    letter-spacing: .4px;
    white-space: nowrap;
  }
  #brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff6b8a; box-shadow: 0 0 12px rgba(255,107,138,.8);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
  #brand .name { font-weight: 700; color: #ffe8ac; }
  #brand .live {
    padding: 2px 7px; border-radius: 5px;
    background: #ff4d6d; color: #fff; font-size: .78em; font-weight: 800;
    letter-spacing: 1px;
  }
  #brand .ai {
    padding-left: 9px; margin-left: 1px;
    border-left: 1px solid rgba(255,255,255,.2);
    color: rgba(255,255,255,.64); font-size: .82em;
  }

  /* 右侧栏：视频仍占左侧大部分画面，这里只压住右边一条 */
  #side {
    position: absolute; right: 2.2vw; top: 10vh; bottom: 11vh;
    width: clamp(300px, 23vw, 430px);
    display: flex; flex-direction: column;
    padding: clamp(16px, 1.4vw, 26px);
    border: 1px solid rgba(244,201,104,.25);
    border-radius: 22px;
    background:
      radial-gradient(circle at 100% 0, rgba(255,107,138,.12), transparent 38%),
      linear-gradient(180deg, rgba(12,14,22,.93), rgba(7,8,13,.86));
    box-shadow: 0 24px 60px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(8px);
  }
  .eyebrow {
    display: flex; align-items: center; justify-content: space-between;
    color: #d9b25e; font-size: clamp(9px, .72vw, 12px);
    letter-spacing: 2px; text-transform: uppercase;
  }
  #state {
    color: rgba(255,255,255,.55); letter-spacing: .5px;
    font-size: .92em; text-transform: none;
  }
  #nowTitle {
    margin-top: 10px;
    color: #fff8e7;
    font-size: clamp(16px, 1.28vw, 23px);
    font-weight: 700;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #nowMeta {
    margin-top: 6px;
    color: rgba(255,255,255,.56);
    font-size: clamp(10px, .76vw, 13px);
    line-height: 1.45;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .progress {
    margin-top: 14px; height: 5px; border-radius: 5px;
    background: rgba(255,255,255,.12); overflow: hidden;
  }
  #bar {
    display: block; width: 0%; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, #f4c968, #ff8fa3);
    transition: width .7s linear;
  }
  #time {
    margin-top: 6px; color: rgba(255,255,255,.45);
    font-size: clamp(9px, .7vw, 12px); letter-spacing: .6px;
  }

  .section {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 20px; padding-bottom: 7px;
    border-bottom: 1px solid rgba(255,255,255,.09);
    color: #d9b25e;
    font-size: clamp(9px, .72vw, 12px);
    letter-spacing: 1.6px;
  }
  .section span:last-child { color: rgba(255,255,255,.36); letter-spacing: .4px; }
  #chat {
    flex: 1 1 auto; min-height: 0; overflow: hidden;
    margin-top: 7px; display: flex; flex-direction: column; gap: 7px;
    mask-image: linear-gradient(180deg, transparent 0, #000 12px);
  }
  .chatRow {
    display: flex; gap: 7px; align-items: flex-start;
    font-size: clamp(10px, .78vw, 13px); line-height: 1.42;
  }
  .chatRow .who {
    flex: 0 0 auto; max-width: 34%;
    color: #9fd8ff; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chatRow .what { flex: 1 1 auto; min-width: 0; color: rgba(255,255,255,.82); overflow-wrap: anywhere; }
  .chatRow.sc .who, .chatRow.sc .what { color: #ffd76e; }
  .chatRow.gift .what { color: #ff9ab1; }
  .chatRow.system { opacity: .6; }
  .chatEmpty { color: rgba(255,255,255,.35); font-size: clamp(10px, .78vw, 13px); padding-top: 4px; }
  #next {
    margin-top: 8px; color: rgba(255,255,255,.55);
    font-size: clamp(10px, .76vw, 12.5px); line-height: 1.45;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 左下角：大肥鱼和一句话气泡 */
  #petWrap { position: absolute; left: 2.8vw; bottom: 7.5vh; width: clamp(100px, 8vw, 150px); }
  #petWrap img {
    width: 100%; display: block;
    filter: drop-shadow(0 10px 16px rgba(0,0,0,.55));
  }
  #bubble {
    position: absolute; left: calc(100% + 12px); bottom: 24%;
    min-width: 190px; max-width: clamp(280px, 28vw, 520px);
    padding: 12px 18px 14px;
    border: 2px solid rgba(216,168,74,.9);
    border-radius: 18px;
    background: linear-gradient(180deg, #fffdf7, #f5ecd9);
    color: #1b1d26; text-shadow: none;
    font-size: clamp(13px, 1vw, 18px); line-height: 1.5; font-weight: 600;
    box-shadow: 0 12px 28px rgba(0,0,0,.42);
    opacity: 0; transform: translateY(6px); transition: opacity .22s ease, transform .22s ease;
  }
  #bubble.show { opacity: 1; transform: none; }
  #bubble::before {
    content: ""; position: absolute; left: -9px; bottom: 18px;
    width: 16px; height: 16px;
    background: #fffdf7;
    border-left: 2px solid rgba(216,168,74,.9);
    border-bottom: 2px solid rgba(216,168,74,.9);
    transform: rotate(45deg); border-radius: 0 0 0 4px;
  }

  #footer {
    position: absolute; left: 3vw; right: 2.2vw; bottom: 2.6vh;
    display: flex; align-items: center; justify-content: space-between;
    color: rgba(255,255,255,.45); font-size: clamp(9px, .68vw, 11px);
    letter-spacing: .6px;
  }
  #footer b { color: rgba(255,255,255,.72); font-weight: 600; }
  #footer .right { display: flex; align-items: center; gap: 8px; }
  #footer .ai { padding: 2px 7px; border: 1px solid rgba(255,255,255,.18); border-radius: 6px; }
</style>
</head>
<body>
<div id="scene">
  <div id="brand">
    <span class="dot"></span>
    <span class="name">大肥鱼 · B站云观影</span>
    <span class="live">LIVE</span>
    <span class="ai">AI 生成 · 虚拟形象</span>
  </div>

  <aside id="side">
    <div class="eyebrow"><span>正在看</span><span id="state">等待中</span></div>
    <div id="nowTitle">还没开始刷视频</div>
    <div id="nowMeta">启动 B站云观影后自动出现</div>
    <div class="progress"><i id="bar"></i></div>
    <div id="time">--:-- / --:--</div>

    <div class="section"><span>直播弹幕</span><span id="roomHint">只读</span></div>
    <div id="chat"><div class="chatEmpty">等待直播间弹幕…</div></div>

    <div class="section"><span>接下来</span><span>PLAYLIST</span></div>
    <div id="next">—</div>
  </aside>

  <div id="petWrap">
    <img src="/assets/pet_front.png" alt="大肥鱼">
    <div id="bubble"><span id="bubbleText"></span></div>
  </div>

  <div id="footer">
    <span id="footerState">等待 B站云观影启动</span>
    <span class="right"><span id="roomLabel">直播间 · <b>—</b></span><span class="ai">AI 生成</span></span>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const stateEl = $('state'), titleEl = $('nowTitle'), metaEl = $('nowMeta');
  const barEl = $('bar'), timeEl = $('time'), nextEl = $('next');
  const chatEl = $('chat'), roomHint = $('roomHint'), roomLabel = $('roomLabel');
  const footerState = $('footerState'), bubble = $('bubble'), bubbleText = $('bubbleText');

  let lastId = 0;
  let hydrated = false;
  let bubbleTimer = null;
  let actx = null;
  let ttsBus = null;
  let source = null;
  let playToken = 0;
  let liveChannel = null;

  // 曼波 TTS 的峰值接近满刻度、平均音量却偏低（实测 RMS 约 -20 dBFS）。
  // 直接拉增益会把峰值削爆，所以先提 6 dB，限幅后再补 3 dB：平均响度上来，峰值仍留余量。
  const TTS_GAIN = 2.0;
  const TTS_MAKEUP = 1.4;
  // 只有 OBS 浏览器源里的页面负责出声。普通浏览器/直播姬内置浏览器打开 /bili
  // 只补字幕，不播 TTS，也不登记 live，避免又叠出第二路声音。
  const IS_OBS = /OBS\//i.test(navigator.userAgent) || !!window.obsstudio;

  const STATE_LABEL = {
    SELECTING: '选片中', PREPARING: '准备中', PLAYING: '播放中', PAUSED: '已暂停',
    WAITING: '等待候选', STOPPED: '已停止', ERROR: '出错了',
  };

  function fmtTime(value) {
    const s = Math.max(0, Math.round(Number(value) || 0));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function clean(text) {
    return String(text || '').replace(/(?:大肥鱼|DeepSeek|AI)\s*[:：]\s*/gi, '')
      .replace(/\s+/g, ' ').trim().slice(0, 180);
  }

  function showBubble(text, holdMs) {
    text = clean(text);
    if (!text) return;
    bubbleText.textContent = text;
    bubble.classList.add('show');
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), Math.max(1200, holdMs || 6000));
  }

  function markLiveAudio(dur) {
    const q = '/mark?ev=audio&role=live&why=scene&dur=' + encodeURIComponent(Number(dur) || 0);
    fetch(q, { cache: 'no-store' }).catch(() => {});
  }

  function claimLiveAudio() {
    // 告诉桌宠进程：Bili Watch 页面就是当前直播的音频主，别再让桌宠窗口重复播 TTS。
    // 页面加载先占位，之后每次真正起播再更新 audio_ts。
    if (!IS_OBS || liveChannel) return;
    try {
      liveChannel = new EventSource('/events?role=live');
      liveChannel.onmessage = () => {};
      liveChannel.onopen = () => markLiveAudio(0);
    } catch (e) { /* 老浏览器/OBS 不支持时仍可只看画面 */ }
  }

  function audioCtx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC({ latencyHint: 'interactive' });
    }
    if (actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
    return actx;
  }

  function ttsOutput(ctx) {
    // 单独建一条 TTS 母线，避免每句话都新建增益/压缩节点；限幅器只压峰值，不压正常说话。
    if (ttsBus) return ttsBus;
    const gain = ctx.createGain();
    gain.gain.value = TTS_GAIN;
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -12;
    limiter.knee.value = 6;
    limiter.ratio.value = 8;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.25;
    const makeup = ctx.createGain();
    makeup.gain.value = TTS_MAKEUP;
    gain.connect(limiter);
    limiter.connect(makeup);
    makeup.connect(ctx.destination);
    ttsBus = gain;
    return ttsBus;
  }

  function stopAudio() {
    if (source) { try { source.stop(); } catch (e) {} source = null; }
  }

  async function speak(text, token) {
    text = clean(text);
    if (!text) return;
    if (!IS_OBS) {
      // 非 OBS 页面只显示字幕；在这里播会和 OBS 源形成第二路声音。
      showBubble(text, 6000);
      return;
    }
    try {
      const r = await fetch('/tts?text=' + encodeURIComponent(text), { cache: 'no-store' });
      if (!r.ok) throw new Error('tts');
      const buf = await r.arrayBuffer();
      if (!buf.byteLength) throw new Error('empty');
      const ctx = audioCtx();
      if (!ctx) throw new Error('audio');
      const decoded = await ctx.decodeAudioData(buf);
      if (token !== playToken) return;
      stopAudio();
      const src = ctx.createBufferSource();
      src.buffer = decoded;
      src.connect(ttsOutput(ctx));
      source = src;
      src.onended = () => {
        if (source === src) source = null;
        showBubble(text, 1400);
      };
      src.start();
      claimLiveAudio();
      markLiveAudio(decoded.duration);
      showBubble(text, decoded.duration * 1000 + 900);
    } catch (e) {
      // 没有 TTS 也把这句话留在屏幕上，直播画面不能因为配音服务失败而空掉。
      showBubble(text, 6000);
    }
  }

  async function pollState() {
    try {
      const r = await fetch('/state?after=' + lastId, { cache: 'no-store' });
      const d = await r.json();
      if (typeof d.seq === 'number' && d.seq < lastId) lastId = 0;
      const list = (d.comments || []).filter((c) => typeof c.id !== 'number' || c.id > lastId);
      if (!list.length) return;
      lastId = Math.max(lastId, ...list.map((c) => Number(c.id) || 0));
      const latest = list[list.length - 1];
      const text = latest.speech || latest.thought || latest.meme || '';
      if (!hydrated) {
        // 页面刚打开时只补字幕，不把上一句重播一遍。
        hydrated = true;
        if (text) showBubble(text, 5000);
        return;
      }
      if (text) {
        const token = ++playToken;
        speak(text, token);
      }
    } catch (e) { /* 保留上一帧，不把场景刷空 */ }
  }

  function addChat(row) {
    const line = document.createElement('div');
    line.className = 'chatRow ' + String(row.kind || '').replace(/[^a-z]/gi, '');
    const who = document.createElement('span');
    who.className = 'who';
    const what = document.createElement('span');
    what.className = 'what';
    const kind = String(row.kind || '');
    const user = String(row.user || '');
    let text = clean(row.text || '');
    if (kind === 'gift' && !text) text = '送出 ' + String(row.gift || '礼物') + (row.count ? ' ×' + row.count : '');
    if (kind === 'sc' && !text) text = '醒目留言';
    who.textContent = user || (kind === 'system' ? '系统' : '观众');
    what.textContent = text || '…';
    line.append(who, what);
    return line;
  }

  function renderEvents(events) {
    chatEl.replaceChildren();
    // 系统「在线 N 人」不占弹幕区；只留有内容的互动。
    const rows = (events || []).filter((row) => String(row.kind || '') !== 'system').slice(-9);
    if (!rows.length) {
      const empty = document.createElement('div');
      empty.className = 'chatEmpty';
      empty.textContent = '等待直播间弹幕…';
      chatEl.append(empty);
      roomHint.textContent = '只读';
      return;
    }
    for (const row of rows) chatEl.append(addChat(row));
    chatEl.scrollTop = chatEl.scrollHeight;
    roomHint.textContent = rows.length + ' 条';
  }

  function currentItem(play, playlist) {
    const items = Array.isArray(playlist.items) ? playlist.items : [];
    const bvid = String(play.bvid || playlist.current_bvid || '');
    return items.find((x) => String(x.bvid || '') === bvid) || items[0] || null;
  }

  function renderScene(d) {
    const play = d.play || {};
    const playlist = d.playlist || {};
    const item = currentItem(play, playlist);
    const title = String(play.video_title || (item && item.title) || '还没开始刷视频');
    const owner = String((item && item.owner) || '');
    const bvid = String(play.bvid || (item && item.bvid) || '');
    titleEl.textContent = title;
    metaEl.textContent = owner ? owner + (bvid ? ' · ' + bvid : '') : (bvid || '启动 B站云观影后自动出现');
    const state = String(play.screen || '').toUpperCase();
    const running = !!play.running;
    stateEl.textContent = running ? (STATE_LABEL[state] || state || '运行中') : (play.game === 'bilibili-hot-commentary' ? '待启动' : '未启用');
    const duration = Number(play.duration_s || (item && item.duration_s) || 0);
    const position = Number(play.position_s || 0);
    const pct = duration > 0 ? Math.max(0, Math.min(100, position / duration * 100)) : 0;
    barEl.style.width = pct.toFixed(2) + '%';
    timeEl.textContent = fmtTime(position) + ' / ' + fmtTime(duration);
    footerState.textContent = play.last || (running ? '大肥鱼正在看视频' : '等待 B站云观影启动');

    const items = Array.isArray(playlist.items) ? playlist.items : [];
    const idx = items.findIndex((x) => String(x.bvid || '') === bvid);
    const nxt = idx >= 0 ? items[idx + 1] : items[1];
    nextEl.textContent = nxt ? String(nxt.title || nxt.bvid || '—') : (playlist.state === 'playing' ? '播放中，等待下一条' : '—');

    const room = d.room_id ? String(d.room_id) : '—';
    roomLabel.textContent = '直播间 · ' + room;
    renderEvents(d.events);
  }

  async function pollScene() {
    try {
      const r = await fetch('/api/bilibili/scene', { cache: 'no-store' });
      renderScene(await r.json());
    } catch (e) { /* 服务重启的几秒里保留上一帧 */ }
  }

  claimLiveAudio();
  pollState();
  pollScene();
  setInterval(pollState, 1000);
  setInterval(pollScene, 2000);
</script>
</body>
</html>
